<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <symbol id="leaf" viewBox="-2 -16 36 32">
      <path d="M0 0 Q 14 -16 30 -2 Q 14 8 0 0 Z" fill="currentColor" fill-opacity="0.55"/>
      <path d="M0 0 Q 14 -16 30 -2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
      <path d="M3 -1 L 24 -4" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.7"/>
    </symbol>
    <symbol id="leaf-small" viewBox="-2 -12 26 24">
      <path d="M0 0 Q 10 -12 22 -2 Q 10 6 0 0 Z" fill="currentColor" fill-opacity="0.5"/>
      <path d="M0 0 Q 10 -12 22 -2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8"/>
      <path d="M2 -1 L 18 -3" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" stroke-opacity="0.65"/>
    </symbol>
  </defs>
  <g color="#3f7a6c" opacity="0.34">
    <!-- Top-left sprig: stem with three leaves -->
    <g transform="translate(15 38) rotate(18)">
      <path d="M0 0 L 88 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8"/>
      <use href="#leaf" x="3" y="-1" width="28" height="24"/>
      <use href="#leaf" x="32" y="-1" width="28" height="24"/>
      <use href="#leaf" x="61" y="-1" width="28" height="24"/>
    </g>

    <!-- Top-right single leaf with curved stem -->
    <g transform="translate(180 55) rotate(-32)">
      <path d="M-22 10 Q -12 5 0 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.8"/>
      <use href="#leaf" x="0" y="-1" width="32" height="26"/>
    </g>

    <!-- Center mirrored pair (X shape) -->
    <g transform="translate(110 125) rotate(48)">
      <path d="M-32 0 L 32 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8"/>
      <g transform="scale(-1 1)">
        <use href="#leaf" x="3" y="-1" width="28" height="24"/>
      </g>
      <use href="#leaf" x="3" y="-1" width="28" height="24"/>
    </g>

    <!-- Bottom-left single -->
    <g transform="translate(38 195) rotate(-22)">
      <path d="M-16 9 Q -8 4 0 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.8"/>
      <use href="#leaf" x="0" y="-1" width="30" height="24"/>
    </g>

    <!-- Bottom-right sprig: two leaves -->
    <g transform="translate(165 195) rotate(118)">
      <path d="M0 0 L 60 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.8"/>
      <use href="#leaf-small" x="3" y="-1" width="24" height="20"/>
      <use href="#leaf-small" x="30" y="-1" width="24" height="20"/>
    </g>

    <!-- Mid-left small accent -->
    <g transform="translate(48 105) rotate(-55)">
      <use href="#leaf-small" x="0" y="0" width="22" height="18"/>
    </g>

    <!-- Top-mid small accent -->
    <g transform="translate(95 32) rotate(72)">
      <use href="#leaf-small" x="0" y="0" width="20" height="16"/>
    </g>

    <!-- Right-mid small accent -->
    <g transform="translate(205 140) rotate(38)">
      <use href="#leaf-small" x="0" y="0" width="22" height="18"/>
    </g>

    <!-- Bottom-mid small accent -->
    <g transform="translate(108 215) rotate(-12)">
      <use href="#leaf-small" x="0" y="0" width="20" height="16"/>
    </g>
  </g>
</svg>
